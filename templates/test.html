<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  select, button, input { font-size: 16px; margin: 4px 0; }
  pre { background: #0b1c30; color: #acedff; padding: 12px; border-radius: 8px; overflow: auto; max-height: 420px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<h2>API test (step 2)</h2>
<div class="row">
  <input type="file" id="file" accept=".csv">
  <select id="cond">
    <option value="rest">rest</option>
    <option value="postural">postural</option>
    <option value="kinetic">kinetic</option>
  </select>
  <button id="go">Analyze</button>
</div>
<h3 id="summary"></h3>
<pre id="out">Waiting...</pre>
<script>
document.getElementById('go').onclick = async () => {
  const f = document.getElementById('file').files[0];
  const out = document.getElementById('out');
  const sum = document.getElementById('summary');
  if (!f) { out.textContent = 'Choose a CSV first.'; return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('condition', document.getElementById('cond').value);
  out.textContent = 'Analyzing...';
  const res = await fetch('/api/analyze', { method: 'POST', body: fd });
  const data = await res.json();
  if (!res.ok) { sum.textContent = ''; out.textContent = 'ERROR: ' + data.error; return; }
  sum.textContent = data.reliable
    ? `Frequency: ${data.frequency_hz} Hz  |  ${data.result_title}`
    : `No reliable peak  |  ${data.result_title}`;
  const short = { ...data, waveform: `[${data.waveform.t.length} points]`, spectrum: `[${data.spectrum.f.length} points]` };
  out.textContent = JSON.stringify(short, null, 2);
};
</script>
</body>
</html>
